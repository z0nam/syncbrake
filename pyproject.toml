[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncbrake"
version = "0.1.0"
description = "Smart battery & hotspot saver for macOS, Windows, and Linux — App-aware cloud sync pausing (Google Drive Tier-0), power-bank & 80%-sailing detection, scheduled auto-resume, and AI-ready CLI/Tray/UI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Namun Cho" }]
keywords = ["battery", "macos", "windows", "linux", "google-drive", "resilio-sync", "tailscale", "hotspot", "power-saver", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Power (UPS)",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
syncbrake = "syncbrake.cli:main"
sb = "syncbrake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/syncbrake"]
